name = "user-mgmt"
main = "src/index.ts"
compatibility_date = "2024-01-17"


[[services]]
binding = "sessionService"
service = "session-state"

[[d1_databases]]
binding = "usersDB"
database_name = "hono-bbs-db"
database_id = "b3597f13-df80-4685-87fe-abd54f5efbc6"

[vars]
EMAIL_FROM = "xuexiang@lianggong.dpdns.org"
EMAIL_FROM_NAME = "凉宫数据"

EMAIL_DKIM_SELECTOR = "mailchannels"
EMAIL_DKIM_DOMAIN = "HSDC.dpdns.org"
FORGOT_PASSWORD_URL = "https://HSDC.dpdns.org/forgot-password"
TOKEN_VALID_MINUTES = 60

# RBAC Configuration
RBAC_ENABLED = "false"
SUPER_ADMIN_EMAIL = ""
# Security: Must be set to "true" to confirm admin email ownership before bootstrap
# This prevents attackers from registering with a known admin email before the real admin
SUPER_ADMIN_EMAIL_CONFIRMED = "false"
# Enable IP address logging in audit logs (GDPR consideration - disabled by default)
LOG_IP_ADDRESS = "false"

[dev]
port = 51512
